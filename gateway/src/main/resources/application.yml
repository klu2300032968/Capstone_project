server:
  port: ${PORT:${SERVER_PORT:8081}}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5174,http://127.0.0.1:5173,http://127.0.0.1:3000,http://192.168.*:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
              - "X-RateLimit-Limit"
              - "X-RateLimit-Remaining"
              - "Retry-After"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: health-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/health
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_HEALTH:}
                whitelist: ${IP_WHITELIST_HEALTH:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_HEALTH_CAPACITY:30}
                refillTokens: ${RATE_LIMIT_HEALTH_REFILL:30}
                refillDurationSeconds: ${RATE_LIMIT_HEALTH_DURATION:60}
        - id: auth-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/**, /api/auth
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_AUTH:}
                whitelist: ${IP_WHITELIST_AUTH:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
                refillTokens: ${RATE_LIMIT_AUTH_REFILL:10}
                refillDurationSeconds: ${RATE_LIMIT_AUTH_DURATION:60}
        - id: products-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/public/**, /api/public
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_PRODUCTS:}
                whitelist: ${IP_WHITELIST_PRODUCTS:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_PRODUCTS_CAPACITY:50}
                refillTokens: ${RATE_LIMIT_PRODUCTS_REFILL:50}
                refillDurationSeconds: ${RATE_LIMIT_PRODUCTS_DURATION:60}
        - id: orders-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/orders/**, /api/orders
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_ORDERS:}
                whitelist: ${IP_WHITELIST_ORDERS:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_ORDERS_CAPACITY:20}
                refillTokens: ${RATE_LIMIT_ORDERS_REFILL:20}
                refillDurationSeconds: ${RATE_LIMIT_ORDERS_DURATION:60}
        - id: payments-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/payments/**, /api/payments
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_PAYMENTS:}
                whitelist: ${IP_WHITELIST_PAYMENTS:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_PAYMENTS_CAPACITY:10}
                refillTokens: ${RATE_LIMIT_PAYMENTS_REFILL:10}
                refillDurationSeconds: ${RATE_LIMIT_PAYMENTS_DURATION:60}
        - id: users-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/users/**, /api/users
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_USERS:}
                whitelist: ${IP_WHITELIST_USERS:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_USERS_CAPACITY:15}
                refillTokens: ${RATE_LIMIT_USERS_REFILL:15}
                refillDurationSeconds: ${RATE_LIMIT_USERS_DURATION:60}
        - id: audit-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/audit-logs/**, /api/audit-logs
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_AUDIT:}
                whitelist: ${IP_WHITELIST_AUDIT:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_AUDIT_CAPACITY:30}
                refillTokens: ${RATE_LIMIT_AUDIT_REFILL:30}
                refillDurationSeconds: ${RATE_LIMIT_AUDIT_DURATION:60}
        - id: arsa-route
          uri: ${BACKEND_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/arsa/**, /api/arsa
          filters:
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_ARSA:}
                whitelist: ${IP_WHITELIST_ARSA:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_ARSA_CAPACITY:30}
                refillTokens: ${RATE_LIMIT_ARSA_REFILL:30}
                refillDurationSeconds: ${RATE_LIMIT_ARSA_DURATION:60}

        # --- Sri Balaji Medi Systems Routes (Phase 2.3) ---
        - id: sbms-public-route
          uri: ${SBMS_BACKEND_URL:https://sri-balaji-medi-systems.onrender.com}
          predicates:
            - Path=/sbms/api/products/**, /sbms/api/meta/**, /sbms/api/reviews/**
          filters:
            - StripPrefix=1
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_SBMS_PUBLIC:}
                whitelist: ${IP_WHITELIST_SBMS_PUBLIC:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_SBMS_PUBLIC_CAPACITY:60}
                refillTokens: ${RATE_LIMIT_SBMS_PUBLIC_REFILL:60}
                refillDurationSeconds: ${RATE_LIMIT_SBMS_PUBLIC_DURATION:60}

        - id: sbms-auth-route
          uri: ${SBMS_BACKEND_URL:https://sri-balaji-medi-systems.onrender.com}
          predicates:
            - Path=/sbms/api/auth/**
          filters:
            - StripPrefix=1
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_SBMS_AUTH:}
                whitelist: ${IP_WHITELIST_SBMS_AUTH:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_SBMS_AUTH_CAPACITY:5}
                refillTokens: ${RATE_LIMIT_SBMS_AUTH_REFILL:5}
                refillDurationSeconds: ${RATE_LIMIT_SBMS_AUTH_DURATION:120}

        - id: sbms-payments-route
          uri: ${SBMS_BACKEND_URL:https://sri-balaji-medi-systems.onrender.com}
          predicates:
            - Path=/sbms/api/payments/**
          filters:
            - StripPrefix=1
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_SBMS_PAYMENTS:}
                whitelist: ${IP_WHITELIST_SBMS_PAYMENTS:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_SBMS_PAYMENTS_CAPACITY:10}
                refillTokens: ${RATE_LIMIT_SBMS_PAYMENTS_REFILL:10}
                refillDurationSeconds: ${RATE_LIMIT_SBMS_PAYMENTS_DURATION:60}

        - id: sbms-protected-route
          uri: ${SBMS_BACKEND_URL:https://sri-balaji-medi-systems.onrender.com}
          predicates:
            - Path=/sbms/api/cart/**, /sbms/api/orders/**, /sbms/api/wishlist/**, /sbms/api/owner/**, /sbms/api/services/**
          filters:
            - StripPrefix=1
            - name: IpFilter
              args:
                enabled: ${IP_FILTER_ENABLED:true}
                blacklist: ${IP_BLACKLIST_SBMS_PROTECTED:}
                whitelist: ${IP_WHITELIST_SBMS_PROTECTED:}
            - name: RateLimiter
              args:
                capacity: ${RATE_LIMIT_SBMS_PROTECTED_CAPACITY:30}
                refillTokens: ${RATE_LIMIT_SBMS_PROTECTED_REFILL:30}
                refillDurationSeconds: ${RATE_LIMIT_SBMS_PROTECTED_DURATION:60}

        - id: sbms-health-route
          uri: ${SBMS_BACKEND_URL:https://sri-balaji-medi-systems.onrender.com}
          predicates:
            - Path=/sbms/health, /sbms/, /sbms
          filters:
            - StripPrefix=1
            - name: RateLimiter
              args:
                capacity: 30
                refillTokens: 30
                refillDurationSeconds: 60

app:
  gateway:
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
