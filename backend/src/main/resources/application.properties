spring.application.name=backend
server.port=${PORT:${SERVER_PORT:8080}}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Database Configuration (configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_security_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Manoj@2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Configuration (configurable via Environment Variables)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
